<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><style>:root{--font-family:{{ font_family }};}{{ theme_css|safe }}
.unlock-body{padding:38px}.unlock-mark{width:86px;height:86px;display:grid;place-items:center;margin:0 auto 24px;border-radius:50%;background:linear-gradient(145deg,#f4b0c8,#d84f83);color:white;font-size:43px;box-shadow:0 10px 28px #e8b2c5}.unlock-list{display:grid;gap:14px}.unlock-row{border:1px solid #e7afc4;border-radius:12px;background:#fff8fb;padding:22px}.unlock-row header{display:flex;justify-content:space-between;align-items:center}.unlock-row h2{font-size:27px;margin:0}.unlock-row b{color:#b23868}.unlock-row p{margin:12px 0 0;color:#765d68;line-height:1.6}</style></head><body><main class="game-sheet" data-pig-catcher-root data-render-ready="true"><header class="game-header"><div class="game-header__copy"><p class="game-header__eyebrow">PiG Dream! · Achievement Unlocked</p><h1>成就已解锁</h1></div><div class="game-header__meta"><span>本次获得</span><strong>+{{ view.total_points }} 点</strong></div></header><section class="unlock-body"><div class="unlock-mark">★</div><div class="unlock-list">{% for item in view.entries %}<article class="unlock-row"><header><h2>{{ item.name }}</h2><b>{{ item.tier_label }} · +{{ item.points }}</b></header><p>奖励：{{ item.reward_text }}</p></article>{% endfor %}</div></section><footer class="game-footer"><span>玩家：{{ view.display_name }} · 奖励已随业务事务结算</span><strong>PiG Dream!</strong></footer></main></body></html>
