<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><style>:root{--font-family:{{ font_family }};}{{ theme_css|safe }}
.summary{padding:38px}.hero{padding:30px;border:1px solid #e7afc4;border-radius:16px;background:linear-gradient(135deg,#fff8fb,#fff)}.hero strong{display:block;font-size:52px;color:#b23868}.hero span{color:#765d68}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:22px}.panel{padding:22px;border:1px solid #efd1dc;border-radius:14px;background:#fff}.panel h2{margin:0 0 14px;font-size:22px;color:#9d315b}.chips{display:flex;flex-wrap:wrap;gap:10px}.chip{padding:8px 12px;border-radius:999px;background:#fff0f5;color:#6d4352}.reward{line-height:1.8;color:#553640}</style></head><body><main class="game-sheet" data-pig-catcher-root data-render-ready="true"><header class="game-header"><div class="game-header__copy"><p class="game-header__eyebrow">PiG Dream! · Historical Achievement Settlement</p><h1>历史成就结算完成</h1></div><div class="game-header__meta"><span>一次性汇总</span><strong>+{{ view.total_points }} 点</strong></div></header><section class="summary"><div class="hero"><span>依据上线前可审计事实，为 {{ view.display_name }} 完成幂等补算</span><strong>{{ view.unlocked_count }} 项成就</strong></div><div class="grid"><article class="panel"><h2>代表性解锁</h2><div class="chips">{% for name in view.highlights %}<span class="chip">{{ name }}</span>{% endfor %}</div></article><article class="panel"><h2>奖励汇总</h2><p class="reward">{{ view.reward_text }}</p></article></div></section><footer class="game-footer"><span>无法可靠证明的隐藏条件将从 2.0 上线后开始累计</span><strong>PiG Dream!</strong></footer></main></body></html>
