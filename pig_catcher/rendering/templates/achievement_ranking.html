<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><style>:root{--font-family:{{ font_family }};}{{ theme_css|safe }}
.rank-list{padding:28px 38px;display:grid;gap:10px}.rank-row{display:grid;grid-template-columns:80px 1fr 190px 150px;align-items:center;border:1px solid #efd7e0;border-radius:10px;padding:18px;background:#fff}.rank-row.top{background:#fff7e7;border-color:#e8c67b}.rank-no{font-size:28px;font-weight:900;color:#b13d6b}.rank-name{font-size:21px;font-weight:800}.rank-points{text-align:right;font-size:24px;color:#a86b12;font-weight:900}.rank-count{text-align:right;color:#765d68}</style></head><body><main class="game-sheet" data-pig-catcher-root data-render-ready="true"><header class="game-header"><div class="game-header__copy"><p class="game-header__eyebrow">PiG Dream! · 成就排行</p><h1>{{ view.group_name }}</h1></div><div class="game-header__meta"><span>参榜玩家</span><strong>{{ view.total_count }} 人</strong></div></header><section class="rank-list">{% for item in view.entries %}<div class="rank-row{% if item.rank <= 3 %} top{% endif %}"><div class="rank-no">{{ item.rank }}</div><div class="rank-name">{{ item.display_name }}</div><div class="rank-points">{{ item.points }} 点</div><div class="rank-count">解锁 {{ item.unlocked_count }} 项</div></div>{% else %}<div class="empty-state">本群尚无成就记录</div>{% endfor %}</section><footer class="game-footer"><span>同分时按解锁数量排序</span><strong>{{ view.page }}/{{ view.page_count }}</strong></footer></main></body></html>
