[project]
name = "maibot-pig-catcher"
version = "1.20.0"
description = "MaiBot 抓猪收集与交易插件"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.20.0,<1.0.0",
    "Jinja2>=3.1.0,<4.0.0",
    "maibot-plugin-sdk>=2.7.0,<3.0.0",
    "Pillow>=11.0.0,<13.0.0",
    "tomlkit>=0.13.3,<1.0.0",
]

[dependency-groups]
dev = [
    "playwright>=1.49.0,<2.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.12.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP"]
